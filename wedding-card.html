<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Card Creator | Biodata Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: #faf7f5;
            min-height: 100vh;
            color: #3d1525;
        }

        /* App Layout */
        .app-root {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 320px;
            height: 100vh;
            overflow-y: auto;
            background: linear-gradient(180deg, #fdf8f9 0%, #fef5f7 100%);
            border-right: 1px solid #f0dce4;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #e8c8d4; border-radius: 4px; }

        /* Sidebar Header */
        .sidebar-header {
            padding-bottom: 16px;
            border-bottom: 1px solid #f0dce4;
            margin-bottom: 8px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            padding: 8px 14px 8px 10px;
            border: 1px solid #e8c8d4;
            border-radius: 8px;
            background: white;
            color: #a06080;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .back-btn:hover {
            background: #fff0f5;
            border-color: #c06080;
            color: #7d3555;
        }

        .sidebar-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            font-weight: 600;
            color: #7d3555;
            letter-spacing: 0.02em;
        }

        .sidebar-subtitle {
            font-size: 0.85rem;
            color: #b07090;
            margin-top: 4px;
        }

        /* Sections */
        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a06080;
        }

        .field-input {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            border: 1px solid #e8c8d4;
            border-radius: 10px;
            background: white;
            color: #3d1525;
            outline: none;
            transition: all 0.15s;
            width: 100%;
        }

        .field-input:focus {
            border-color: #c06080;
            box-shadow: 0 0 0 3px rgba(192, 96, 128, 0.12);
        }

        .field-textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        /* Avatar Grid */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .avatar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border: 2px solid #f0dce4;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .avatar-btn:hover {
            border-color: #e0b0c4;
            background: #fff8fa;
        }

        .avatar-btn.active {
            border-color: #c06080;
            background: #fef0f5;
            box-shadow: 0 2px 8px rgba(192, 96, 128, 0.15);
        }

        .avatar-btn svg {
            width: 48px;
            height: 56px;
        }

        .avatar-label {
            font-size: 0.7rem;
            color: #a06080;
            font-weight: 500;
        }

        /* Theme Grid */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .theme-btn {
            height: 52px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.05);
        }

        .theme-btn.active {
            border-color: #7d3555;
            box-shadow: 0 4px 12px rgba(125, 53, 85, 0.25);
        }

        .theme-label {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            font-size: 0.65rem;
            font-weight: 600;
            text-align: center;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Font Grid */
        .font-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .font-btn {
            padding: 10px;
            border: 2px solid #f0dce4;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            color: #5d3a4a;
            transition: all 0.2s;
        }

        .font-btn:hover {
            border-color: #e0b0c4;
        }

        .font-btn.active {
            border-color: #c06080;
            background: #fef0f5;
        }

        /* Download Button */
        .download-btn {
            margin-top: 10px;
            padding: 14px 24px;
            background: linear-gradient(135deg, #c06080 0%, #9d4a6a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 96, 128, 0.35);
        }

        .download-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: linear-gradient(135deg, #f7f0f3 0%, #f5eef1 100%);
            min-width: 0;
            overflow: auto;
        }

        .canvas-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .canvas-hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #7d3555;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .canvas-drag-hint {
            font-size: 0.8rem;
            color: #b07090;
        }

        /* Card Wrapper */
        .card-wrapper {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        /* Wedding Card */
        #wedding-card {
            width: 600px;
            height: 375px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            user-select: none;
        }

        .card-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .card-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .card-top-line {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            border-top: 2px solid currentColor;
            opacity: 0.5;
        }

        .card-eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        .card-names {
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .card-ampersand {
            opacity: 0.7;
            font-style: italic;
        }

        .card-divider {
            width: 50px;
            height: 1px;
            margin: 16px 0;
            border-top: 1px solid currentColor;
            opacity: 0.4;
        }

        .card-message {
            font-size: 0.9rem;
            max-width: 380px;
            line-height: 1.5;
            margin-bottom: 20px;
            opacity: 0.85;
            font-style: italic;
        }

        .card-details {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .card-detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-detail-label {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .card-detail-value {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-detail-divider {
            width: 1px;
            height: 36px;
            opacity: 0.3;
        }

        .card-bottom-line {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            border-top: 2px solid currentColor;
            opacity: 0.5;
        }

        /* Avatar on Card */
        .card-avatar {
            position: absolute;
            cursor: grab;
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .card-avatar:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        /* Theme Styles */
        .theme-floral {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #fce4ec 60%, #f3e5f5 100%);
        }

        .theme-minimal {
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 50%, #eeeeee 100%);
        }

        .theme-gold {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        }

        .theme-pastel {
            background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 35%, #fce4ec 65%, #fff3e0 100%);
        }

        /* Footer */
        .app-footer {
            position: absolute;
            bottom: 16px;
            right: 24px;
            font-size: 0.75rem;
            color: #b07090;
        }

        /* Mobile View Toggle */
        .mobile-view-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: linear-gradient(135deg, #c06080 0%, #9d4a6a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(192, 96, 128, 0.4);
            transition: all 0.2s;
        }

        .mobile-view-toggle:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 12px 32px rgba(192, 96, 128, 0.5);
        }

        .mobile-view-toggle svg {
            vertical-align: middle;
            margin-right: 8px;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .app-root {
                flex-direction: column;
                position: relative;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: none;
                padding-bottom: 100px;
            }
            .canvas-area {
                padding: 20px;
                padding-bottom: 100px;
                display: none;
            }
            .canvas-area.mobile-show {
                display: flex;
            }
            .sidebar.mobile-hide {
                display: none;
            }
            #wedding-card {
                width: 100%;
                max-width: 500px;
                height: auto;
                aspect-ratio: 8/5;
            }
            .card-names {
                font-size: 1.5rem;
            }
            .card-message {
                font-size: 0.8rem;
            }
            .card-detail-value {
                font-size: 0.85rem;
            }
            .mobile-view-toggle {
                display: flex;
                align-items: center;
            }
            .card-avatar svg {
                width: 70px;
                height: 82px;
            }
            .app-footer {
                display: none;
            }
            .canvas-header {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                padding: 16px 14px 100px;
            }
            .avatar-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .avatar-btn {
                padding: 8px 4px;
            }
            .avatar-btn svg {
                width: 36px;
                height: 42px;
            }
            .theme-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .theme-btn {
                height: 44px;
            }
            .font-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .font-btn {
                padding: 8px 4px;
                font-size: 0.8rem;
            }
            #wedding-card {
                max-width: 100%;
            }
            .card-names {
                font-size: 1.2rem;
            }
            .card-eyebrow {
                font-size: 0.65rem;
            }
            .card-content {
                padding: 16px;
            }
            .card-avatar svg {
                width: 55px;
                height: 65px;
            }
        }
    </style>
</head>
<body>
    <div class="app-root">
        <!-- Mobile View Toggle Button -->
        <button class="mobile-view-toggle" id="mobileViewToggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21,15 16,10 5,21"/>
            </svg>
            Show Preview
        </button>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="./index.html" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back

                <h1 class="sidebar-title">Wedding Card</h1>
                <p class="sidebar-subtitle">Create your perfect invitation</p>
            </div>

            <div class="section">
                <label class="field-label">Bride's Name</label>
                <input class="field-input" id="brideName" value="Isabella" placeholder="Bride's name">
            </div>

            <div class="section">
                <label class="field-label">Groom's Name</label>
                <input class="field-input" id="groomName" value="Alexander" placeholder="Groom's name">
            </div>

            <div class="section">
                <label class="field-label">Date</label>
                <input class="field-input" id="weddingDate" value="June 14, 2025" placeholder="e.g. June 14, 2025">
            </div>

            <div class="section">
                <label class="field-label">Venue</label>
                <input class="field-input" id="venue" value="The Grand Rosewood Estate" placeholder="Venue name">
            </div>

            <div class="section">
                <label class="field-label">Short Message</label>
                <textarea class="field-input field-textarea" id="message" placeholder="A short message for guests" rows="3">Together with their families, invite you to celebrate their wedding</textarea>
            </div>

            <div class="section">
                <label class="field-label">Avatar</label>
                <div class="avatar-grid">
                    <button class="avatar-btn active" data-avatar="1">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">

                            <path d="M15 100 Q15 68 40 68 Q65 68 65 100 L65 140 L15 140Z" fill="#e8b4cb" stroke="#c9956a" stroke-width="1.5"/>
                            <path d="M28 68 Q40 56 52 68 Q40 72 28 68Z" fill="#f5e6d3" stroke="#c9956a" stroke-width="1"/>
                            <ellipse cx="80" cy="30" rx="13" ry="15" fill="#f5cba7" stroke="#c9956a" stroke-width="1.5"/>
                            <rect x="62" y="68" width="36" height="55" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
                            <rect x="68" y="68" width="24" height="20" rx="2" fill="#f5f5f5"/>
                            <rect x="76" y="50" width="8" height="18" rx="2" fill="#f5e6d3"/>
                        </svg>
                        <span class="avatar-label">Classic</span>
                    </button>
                    <button class="avatar-btn" data-avatar="2">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="38" cy="26" rx="13" ry="15" fill="#fde8d8" stroke="#e8a87c" stroke-width="1.5"/>
                            <path d="M12 100 Q12 65 38 65 Q64 65 64 100 L64 140 L12 140Z" fill="#f9c8d4" stroke="#e8a87c" stroke-width="1.5"/>
                            <circle cx="25" cy="55" r="5" fill="#ff9eb5"/>
                            <circle cx="38" cy="52" r="5" fill="#ff9eb5"/>
                            <circle cx="51" cy="55" r="5" fill="#ff9eb5"/>
                            <ellipse cx="82" cy="28" rx="13" ry="15" fill="#fde8d8" stroke="#e8a87c" stroke-width="1.5"/>
                            <rect x="64" y="68" width="36" height="52" rx="3" fill="#7b6fa0" stroke="#5a5080" stroke-width="1.5"/>
                            <rect x="70" y="68" width="24" height="18" rx="2" fill="#f0ede8"/>
                            <rect x="77" y="48" width="10" height="20" rx="2" fill="#fde8d8"/>
                        </svg>
                        <span class="avatar-label">Floral</span>
                    </button>
                    <button class="avatar-btn" data-avatar="3">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="38" cy="27" r="15" fill="#ffe0cc" stroke="#d4956a" stroke-width="1.5"/>
                            <path d="M10 140 L10 95 Q10 65 38 65 Q66 65 66 95 L66 140Z" fill="#f0c0d8"/>
                            <path d="M22 65 L38 80 L54 65" fill="none" stroke="#d4956a" stroke-width="2"/>

                            <rect x="65" y="68" width="34" height="50" rx="5" fill="#1a1a2e"/>
                            <rect x="72" y="68" width="20" height="16" rx="2" fill="#f0f0f0"/>

                            <rect x="74" y="48" width="16" height="20" rx="3" fill="#ffe0cc"/>
                        </svg>
                        <span class="avatar-label">Modern</span>
                    </button>
                    <button class="avatar-btn" data-avatar="4">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">

                            <rect x="74" y="66" width="20" height="16" rx="2" fill="#f5f5f0"/>
                            <rect x="78" y="45" width="12" height="21" rx="2" fill="#fcebd5"/>
                        </svg>
                        <span class="avatar-label">Elegant</span>
                    </button>
                    <button class="avatar-btn" data-avatar="5">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="37" cy="26" r="16" fill="#ffe8f0" stroke="#f4a0c0" stroke-width="1.5"/>

                            <rect x="66" y="65" width="34" height="55" rx="6" fill="#6c5ce7"/>
                            <rect x="74" y="65" width="18" height="15" rx="2" fill="#f8f0ff"/>
                            <rect x="77" y="44" width="12" height="21" rx="4" fill="#ffe8f0"/>
                        </svg>
                        <span class="avatar-label">Whimsical</span>
                    </button>
                    <button class="avatar-btn" data-avatar="6">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="37" cy="27" rx="14" ry="16" fill="#fdebd0" stroke="#d4a017" stroke-width="1.5"/>
                            <path d="M10 140 L10 92 Q10 64 37 64 Q64 64 64 92 L64 140Z" fill="#fff8e1"/>
                            <path d="M20 64 L37 52 L54 64" fill="#ffd700" stroke="#d4a017" stroke-width="1"/>
                            <rect x="33" y="38" width="8" height="8" rx="1" fill="#ffd700" stroke="#d4a017" stroke-width="1"/>
                            <ellipse cx="83" cy="27" rx="13" ry="15" fill="#fdebd0" stroke="#d4a017" stroke-width="1.5"/>
                            <rect x="66" y="66" width="34" height="54" rx="3" fill="#1a237e"/>
                            <rect x="74" y="66" width="18" height="14" rx="2" fill="#f5f0e8"/>
                            <rect x="77" y="46" width="12" height="20" rx="2" fill="#fdebd0"/>
                            <path d="M77 50 L83 44 L89 50" fill="#ffd700" stroke="#d4a017" stroke-width="1"/>
                        </svg>
                        <span class="avatar-label">Royal</span>
                    </button>
                </div>
            </div>

            <div class="section">
                <label class="field-label">Theme</label>
                <div class="theme-grid">
                    <button class="theme-btn active theme-floral" data-theme="floral">
                        <span class="theme-label">Floral</span>
                    </button>
                    <button class="theme-btn theme-minimal" data-theme="minimal">
                        <span class="theme-label" style="color:#555;">Minimal</span>
                    </button>
                    <button class="theme-btn theme-gold" data-theme="gold">
                        <span class="theme-label" style="color:#ffd700;">Gold</span>
                    </button>
                    <button class="theme-btn theme-pastel" data-theme="pastel">
                        <span class="theme-label" style="color:#7986cb;">Pastel</span>
                    </button>
                </div>
            </div>

            <div class="section">
                <label class="field-label">Font</label>
                <div class="font-grid">
                    <button class="font-btn active" data-font="cormorant" style="font-family: 'Cormorant Garamond', serif;">Cormorant</button>
                    <button class="font-btn" data-font="playfair" style="font-family: 'Playfair Display', serif;">Playfair</button>
                    <button class="font-btn" data-font="script" style="font-family: 'Great Vibes', cursive;">Script</button>
                </div>
            </div>

            <button class="download-btn" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download as PNG
            </button>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area" id="canvasArea">
            <div class="canvas-header">
                <span class="canvas-hint">Live Preview</span>
                <span class="canvas-drag-hint">Drag the couple to reposition</span>
            </div>

            <div class="card-wrapper">
                <div id="wedding-card" class="theme-floral">
                    <!-- Decoration SVG -->
                    <svg class="card-decoration" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" id="decorationSvg">
                        <!-- Floral decoration (default) -->
                    </svg>

                    <!-- Card Content -->
                    <div class="card-content" id="cardContent" style="font-family: 'Cormorant Garamond', serif; color: #5d1a35;">
                        <div class="card-top-line"></div>
                        <p class="card-eyebrow" id="cardEyebrow">~ Wedding Invitation ~</p>
                        <h2 class="card-names">
                            <span id="cardBride">Isabella</span>
                            <span class="card-ampersand"> & </span>
                            <span id="cardGroom">Alexander</span>
                        </h2>
                        <div class="card-divider"></div>
                        <p class="card-message" id="cardMessage">Together with their families, invite you to celebrate their wedding</p>
                        <div class="card-details">
                            <div class="card-detail-item">
                                <span class="card-detail-label">Date</span>
                                <span class="card-detail-value" id="cardDate">June 14, 2025</span>
                            </div>
                            <div class="card-detail-divider" style="background: currentColor;"></div>
                            <div class="card-detail-item">
                                <span class="card-detail-label">Venue</span>
                                <span class="card-detail-value" id="cardVenue">The Grand Rosewood Estate</span>
                            </div>
                        </div>
                        <div class="card-bottom-line"></div>
                    </div>

                    <!-- Draggable Avatar -->
                    <div class="card-avatar" id="cardAvatar" style="right: 40px; top: 100px;">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" width="90" height="105" id="avatarSvg">
                            <ellipse cx="40" cy="28" rx="14" ry="16" fill="#f5cba7" stroke="#c9956a" stroke-width="1.5"/>
                            <path d="M15 100 Q15 68 40 68 Q65 68 65 100 L65 140 L15 140Z" fill="#e8b4cb" stroke="#c9956a" stroke-width="1.5"/>
                            <path d="M28 68 Q40 56 52 68 Q40 72 28 68Z" fill="#f5e6d3" stroke="#c9956a" stroke-width="1"/>
                            <ellipse cx="80" cy="30" rx="13" ry="15" fill="#f5cba7" stroke="#c9956a" stroke-width="1.5"/>
                            <rect x="62" y="68" width="36" height="55" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
                            <rect x="68" y="68" width="24" height="20" rx="2" fill="#f5f5f5"/>
                            <rect x="76" y="50" width="8" height="18" rx="2" fill="#f5e6d3"/>
                        </svg>
                    </div>
                </div>
            </div>

            <p class="app-footer">Made with ❤️ by Biodata Pro</p>
        </div>
    </div>

    <script>
        // Theme configurations
        const THEMES = {
            floral: {
                background: 'linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #fce4ec 60%, #f3e5f5 100%)',
                accent: '#c06080',
                textColor: '#5d1a35',
                decoration: `<circle cx="60" cy="60" r="35" fill="none" stroke="#e91e8c" stroke-width="1.5" opacity="0.35"/>
                    <circle cx="60" cy="60" r="20" fill="#f8bbd0" opacity="0.35"/>
                    <circle cx="30" cy="60" r="12" fill="#f48fb1" opacity="0.35"/>
                    <circle cx="90" cy="60" r="12" fill="#f48fb1" opacity="0.35"/>
                    <circle cx="740" cy="60" r="35" fill="none" stroke="#e91e8c" stroke-width="1.5" opacity="0.35"/>
                    <circle cx="740" cy="60" r="20" fill="#f8bbd0" opacity="0.35"/>
                    <circle cx="60" cy="440" r="35" fill="none" stroke="#e91e8c" stroke-width="1.5" opacity="0.35"/>
                    <circle cx="740" cy="440" r="35" fill="none" stroke="#e91e8c" stroke-width="1.5" opacity="0.35"/>
                    <path d="M120 10 Q400 5 680 10" stroke="#f48fb1" stroke-width="1.5" fill="none" stroke-dasharray="5,8" opacity="0.5"/>
                    <path d="M120 490 Q400 495 680 490" stroke="#f48fb1" stroke-width="1.5" fill="none" stroke-dasharray="5,8" opacity="0.5"/>`
            },
            minimal: {
                background: 'linear-gradient(135deg, #fafafa 0%, #f5f5f5 50%, #eeeeee 100%)',
                accent: '#555',
                textColor: '#222',
                decoration: `<rect x="20" y="20" width="760" height="460" rx="4" fill="none" stroke="#bbb" stroke-width="1.5" opacity="0.4"/>
                    <rect x="30" y="30" width="740" height="440" rx="3" fill="none" stroke="#ddd" stroke-width="1" opacity="0.4"/>
                    <circle cx="400" cy="250" r="80" fill="none" stroke="#ddd" stroke-width="1" opacity="0.3"/>`
            },
            gold: {
                background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%)',
                accent: '#ffd700',
                textColor: '#ffd700',
                decoration: `<rect x="15" y="15" width="770" height="470" rx="3" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
                    <rect x="25" y="25" width="750" height="450" rx="2" fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.5"/>
                    <path d="M15 15 L50 15 M15 15 L15 50" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
                    <path d="M785 15 L750 15 M785 15 L785 50" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
                    <path d="M15 485 L50 485 M15 485 L15 450" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
                    <path d="M785 485 L750 485 M785 485 L785 450" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
                    <circle cx="400" cy="250" r="90" fill="none" stroke="#ffd700" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>`
            },
            pastel: {
                background: 'linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 35%, #fce4ec 65%, #fff3e0 100%)',
                accent: '#7986cb',
                textColor: '#3949ab',
                decoration: `<circle cx="100" cy="100" r="60" fill="#b2dfdb" opacity="0.3"/>
                    <circle cx="700" cy="100" r="50" fill="#f8bbd0" opacity="0.3"/>
                    <circle cx="100" cy="400" r="50" fill="#fff9c4" opacity="0.3"/>
                    <circle cx="700" cy="400" r="60" fill="#c5cae9" opacity="0.3"/>
                    <path d="M150 15 Q400 0 650 15" stroke="#ce93d8" stroke-width="1.5" fill="none" opacity="0.5"/>
                    <path d="M150 485 Q400 500 650 485" stroke="#ce93d8" stroke-width="1.5" fill="none" opacity="0.5"/>`
            }
        };

        const FONTS = {
            cormorant: "'Cormorant Garamond', serif",
            playfair: "'Playfair Display', serif",
            script: "'Great Vibes', cursive"
        };

        let currentTheme = 'floral';
        let currentFont = 'cormorant';
        let selectedAvatar = 1;

        // Elements
        const weddingCard = document.getElementById('wedding-card');
        const cardContent = document.getElementById('cardContent');
        const decorationSvg = document.getElementById('decorationSvg');
        const cardAvatar = document.getElementById('cardAvatar');
        const avatarSvg = document.getElementById('avatarSvg');

        // Input elements
        const brideInput = document.getElementById('brideName');
        const groomInput = document.getElementById('groomName');
        const dateInput = document.getElementById('weddingDate');
        const venueInput = document.getElementById('venue');
        const messageInput = document.getElementById('message');

        // Preview elements
        const cardBride = document.getElementById('cardBride');
        const cardGroom = document.getElementById('cardGroom');
        const cardDate = document.getElementById('cardDate');
        const cardVenue = document.getElementById('cardVenue');
        const cardMessage = document.getElementById('cardMessage');

        // Live preview updates
        brideInput.addEventListener('input', () => cardBride.textContent = brideInput.value || 'Bride');
        groomInput.addEventListener('input', () => cardGroom.textContent = groomInput.value || 'Groom');
        dateInput.addEventListener('input', () => cardDate.textContent = dateInput.value || 'Date TBD');
        venueInput.addEventListener('input', () => cardVenue.textContent = venueInput.value || 'Venue TBD');
        messageInput.addEventListener('input', () => cardMessage.textContent = messageInput.value || 'Together with their families');

        // Theme selection
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                applyTheme();
            });
        });

        function applyTheme() {
            const theme = THEMES[currentTheme];
            weddingCard.style.background = theme.background;
            cardContent.style.color = theme.textColor;
            decorationSvg.innerHTML = theme.decoration;
        }

        // Font selection
        document.querySelectorAll('.font-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFont = btn.dataset.font;
                cardContent.style.fontFamily = FONTS[currentFont];
            });
        });

        // Avatar selection
        document.querySelectorAll('.avatar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAvatar = parseInt(btn.dataset.avatar);
                const svgContent = btn.querySelector('svg').innerHTML;
                avatarSvg.innerHTML = svgContent;
            });
        });

        // Avatar dragging
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        cardAvatar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = cardAvatar.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            cardAvatar.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const cardRect = weddingCard.getBoundingClientRect();
            let x = e.clientX - cardRect.left - dragOffset.x;
            let y = e.clientY - cardRect.top - dragOffset.y;
            
            // Bounds checking
            x = Math.max(0, Math.min(cardRect.width - 90, x));
            y = Math.max(0, Math.min(cardRect.height - 105, y));
            
            cardAvatar.style.left = x + 'px';
            cardAvatar.style.top = y + 'px';
            cardAvatar.style.right = 'auto';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            cardAvatar.style.cursor = 'grab';
        });

        // Touch support for mobile
        cardAvatar.addEventListener('touchstart', (e) => {
            isDragging = true;
            const touch = e.touches[0];
            const rect = cardAvatar.getBoundingClientRect();
            dragOffset.x = touch.clientX - rect.left;
            dragOffset.y = touch.clientY - rect.top;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            const cardRect = weddingCard.getBoundingClientRect();
            let x = touch.clientX - cardRect.left - dragOffset.x;
            let y = touch.clientY - cardRect.top - dragOffset.y;
            
            x = Math.max(0, Math.min(cardRect.width - 90, x));
            y = Math.max(0, Math.min(cardRect.height - 105, y));
            
            cardAvatar.style.left = x + 'px';
            cardAvatar.style.top = y + 'px';
            cardAvatar.style.right = 'auto';
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Download functionality
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Exporting...';

            try {
                const canvas = await html2canvas(weddingCard, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: null
                });
                
                const link = document.createElement('a');
                const bride = brideInput.value || 'bride';
                const groom = groomInput.value || 'groom';
                link.download = `wedding-card-${bride}-${groom}.png`.toLowerCase().replace(/\s+/g, '-');
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Download failed:', err);
                alert('Download failed. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download as PNG';
            }
        });

        // Initialize theme
        applyTheme();

        // Mobile View Toggle
        const mobileViewToggle = document.getElementById('mobileViewToggle');
        const sidebar = document.getElementById('sidebar');
        const canvasArea = document.getElementById('canvasArea');
        let showingPreview = false;

        function updateMobileToggle() {
            if (window.innerWidth <= 1024) {
                if (showingPreview) {
                    sidebar.classList.add('mobile-hide');
                    canvasArea.classList.add('mobile-show');
                    mobileViewToggle.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Edit Details
                    `;
                } else {
                    sidebar.classList.remove('mobile-hide');
                    canvasArea.classList.remove('mobile-show');
                    mobileViewToggle.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21,15 16,10 5,21"/>
                        </svg>
                        Show Preview
                    `;
                }
            } else {
                // Reset for desktop
                sidebar.classList.remove('mobile-hide');
                canvasArea.classList.remove('mobile-show');
            }
        }

        mobileViewToggle.addEventListener('click', function() {
            showingPreview = !showingPreview;
            updateMobileToggle();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (window.innerWidth > 1024) {
                showingPreview = false;
            }
            updateMobileToggle();
        });

        // Initialize
        updateMobileToggle();
    </script>
</body>
</html>
